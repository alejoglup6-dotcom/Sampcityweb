// App Android NATIVA de SampCity (Kotlin + Jetpack Compose). Usa la misma API que la web (/api/…) con la misma cuenta del juego.
// Dominio de la API: -PWEB_HOST=otro.dominio (por defecto sampcity.app). Versión: sube versionCode/versionName en cada APK nuevo.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def webHost = (project.findProperty('WEB_HOST') ?: 'sampcity.app').toString()
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.sampcity.social'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sampcity.social'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
        buildConfigField 'String', 'BASE_URL', "\"https://${webHost}\""
        manifestPlaceholders = [webHost: webHost]
    }

    buildFeatures { compose true; buildConfig true }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Solo se quita lo que no se usa (los iconos extendidos pesan mucho); sin ofuscar ni optimizar, para no romper nada
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            // En el emulador la API local está en http://10.0.2.2:3000 (el servidor de pruebas)
            buildConfigField 'String', 'BASE_URL', '"http://10.0.2.2:3000"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
    if (project.hasProperty('screenshots')) sourceSets.test.java.srcDir 'src/screenshotTest/java'
    testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'sampcity.api', System.getProperty('sampcity.api') ?: 'http://localhost:3000'; systemProperty 'sampcity.shots', System.getProperty('sampcity.shots') ?: ''
        // Capturas de pantalla (opcional): ./gradlew testDebugUnitTest -Pscreenshots -Dsampcity.shots=/carpeta  (Robolectric baja sus jars de Maven Central)
        if (project.hasProperty('screenshots')) { dependsOn 'copyRobolectricDeps'; systemProperty 'robolectric.offline', 'true'; systemProperty 'robolectric.dependency.dir', "${project.buildDir}/robolectric-deps" }
        } } }
}

configurations { robolectricDeps }
tasks.register('copyRobolectricDeps', Copy) { from configurations.robolectricDeps; into "${project.buildDir}/robolectric-deps" }

dependencies {
    def bom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation bom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'

    // Capturas de pantalla de las pantallas reales (opcional, ver ScreenshotTest): -Pscreenshots
    if (project.hasProperty('screenshots')) {
        robolectricDeps 'org.robolectric:android-all-instrumented:14-robolectric-10818077-i7'
        robolectricDeps 'org.robolectric:nativeruntime-dist-compat:1.0.12'
        testImplementation 'org.robolectric:robolectric:4.13'
        testImplementation 'androidx.test:core:1.6.1'
        testImplementation 'androidx.compose.ui:ui-test-junit4'
        debugImplementation 'androidx.compose.ui:ui-test-manifest'
    }
}
