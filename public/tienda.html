<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tienda · SampCity</title>
  <meta name="theme-color" content="#0e0a0c">
  <link rel="icon" href="/assets/favicon.png">
  <link rel="stylesheet" href="/assets/css/fonts.css?v=1"><link rel="preload" as="font" type="font/woff2" href="/assets/fonts/poppins-latin-400-normal.woff2" crossorigin><link rel="preload" as="font" type="font/woff2" href="/assets/fonts/poppins-latin-600-normal.woff2" crossorigin>
  <style>
    :root {
      --rosa: #F59D99; --rojo: #E8392F; --gr: #9E150F;
      --bg: #0e0a0c; --card: #181115; --in: #120c0f; --border: #33252b;
      --text: #f6f1f2; --muted: #b3a3a8; --err: #ff8b84; --ok: #6ee7a1;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100dvh; color: var(--text); line-height: 1.55;
      font-family: Poppins, system-ui, sans-serif;
      background: radial-gradient(60rem 28rem at 85% -8%, rgba(232,57,47,.18), transparent), var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; padding: calc(1.25rem + env(safe-area-inset-top)) 1rem calc(1.25rem + env(safe-area-inset-bottom));
    }
    :focus-visible { outline: 3px solid var(--rosa); outline-offset: 3px; border-radius: 8px; }
    .logo { height: 2.6rem; width: auto; }
    .store {
      width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border);
      border-radius: 1.25rem; padding: 1.5rem; box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
    p.subtitle { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }
    .product { border: 1px solid var(--border); border-radius: 1rem; padding: 1.1rem; margin-bottom: 1.1rem; background: var(--in); }
    .product h2 { margin: 0 0 .25rem; font-size: 1.25rem; }
    .product .amount { margin: 0 0 .25rem; color: var(--rosa); font-weight: 700; }
    .product .price { margin: 0 0 1rem; color: var(--muted); font-size: .9rem; }
    button {
      width: 100%; min-height: 2.9rem; border: 1px solid var(--rojo); border-radius: 999px; padding: .7rem 1rem;
      background: linear-gradient(180deg, var(--rojo), var(--gr)); color: #fff;
      font: 600 .95rem Poppins, system-ui, sans-serif; cursor: pointer; transition: transform .15s ease, filter .15s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .message { display: none; margin-top: .9rem; padding: .75rem; border-radius: .75rem; font-size: .88rem; }
    .message.error { display: block; background: rgba(255,139,132,.1); border: 1px solid rgba(255,139,132,.35); color: var(--err); }
    .message.info { display: block; background: rgba(110,231,161,.1); border: 1px solid rgba(110,231,161,.35); color: var(--ok); }
    .orders { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.1rem; }
    .orders h3 { margin: 0 0 .75rem; font-size: 1rem; }
    .order { display: flex; justify-content: space-between; gap: .75rem; padding: .6rem 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
    .status { font-weight: 700; }
    .status.pending { color: #fbbf24; }
    .status.paid { color: #60a5fa; }
    .status.delivered { color: var(--ok); }
    .status.failed { color: var(--err); }
    .empty { color: var(--muted); font-size: .88rem; }
    .back { color: var(--rosa); font-size: .9rem; font-weight: 600; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <a href="/"><img class="logo" src="/assets/logo.png" alt="SampCity" width="160" height="42"></a>
  <main class="store">
    <h1>Tienda SampCity</h1>
    <p class="subtitle">Compra coins para tu cuenta. El pago se procesa de forma segura con Tebex.</p>

    <section id="products">
      <div class="product">
        <h2>10 Coins</h2>
        <p class="amount">10 coins para tu cuenta</p>
        <p class="price" id="price">Cargando precio…</p>
        <button id="buy" disabled>Cargando…</button>
      </div>
    </section>

    <div id="message" class="message"></div>

    <section class="orders">
      <h3>Mis compras</h3>
      <div id="orders" class="empty">Cargando historial…</div>
    </section>
  </main>
  <a class="back" href="/">← Volver a la web</a>

  <script>
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const message = document.getElementById("message");
    const buyButton = document.getElementById("buy");
    const priceElement = document.getElementById("price");
    const ordersElement = document.getElementById("orders");

    const showMessage = (text, type = "info") => {
      message.className = `message ${type}`;
      message.textContent = text;
    };

    const hideMessage = () => {
      message.className = "message";
      message.textContent = "";
    };

    const statusText = {
      pending: "Pendiente",
      paid: "Pagado",
      delivered: "Entregado",
      failed: "Error"
    };

    async function loadCatalog() {
      try {
        const response = await fetch("/api/store/catalog");

        if (response.status === 401) {
          showMessage("Inicia sesión para ver la tienda.", "error");
          return;
        }

        const data = await response.json();
        const product = data.products?.[0];

        if (!product) {
          priceElement.textContent = "No hay productos disponibles.";
          buyButton.textContent = "No disponible";
          return;
        }

        priceElement.textContent = product.price !== null
          ? `Precio: ${product.price} ${product.currency}`
          : "El precio se mostrará en el checkout.";

        buyButton.disabled = false;
        buyButton.textContent = "Comprar 10 Coins";
        buyButton.dataset.packageId = product.packageId;
      } catch {
        priceElement.textContent = "No se pudo cargar la tienda.";
        buyButton.textContent = "Reintentar";
      }
    }

    async function loadOrders() {
      try {
        const response = await fetch("/api/store/orders");

        if (response.status === 401) {
          ordersElement.textContent = "Inicia sesión para ver tus compras.";
          return;
        }

        const data = await response.json();
        const orders = data.orders || [];

        if (!orders.length) {
          ordersElement.textContent = "Todavía no tienes compras.";
          ordersElement.className = "empty";
          return;
        }

        ordersElement.className = "";
        ordersElement.innerHTML = orders.map((order) => `
          <div class="order">
            <span>${esc(order.product)} · ${esc(order.amount)} coins</span>
            <span class="status ${esc(order.delivery_status || order.status)}">
              ${esc(statusText[order.delivery_status] || statusText[order.status] || order.status)}
            </span>
          </div>
        `).join("");
      } catch {
        ordersElement.textContent = "No se pudo cargar el historial.";
      }
    }

    async function buy() {
      const packageId = buyButton.dataset.packageId;
      if (!packageId) return;

      buyButton.disabled = true;
      buyButton.textContent = "Preparando pago…";
      hideMessage();

      try {
        const cartResponse = await fetch("/api/store/cart", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ packageId: Number(packageId) })
        });

        const cartData = await cartResponse.json();

        if (!cartResponse.ok) {
          throw new Error(cartData.error || "No se pudo crear el pedido.");
        }

        const checkoutResponse = await fetch("/api/store/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ basketIdent: cartData.basketIdent })
        });

        const checkoutData = await checkoutResponse.json();

        if (!checkoutResponse.ok || !checkoutData.checkoutUrl) {
          throw new Error(checkoutData.error || "No se pudo iniciar el pago.");
        }

        showMessage("Te estamos llevando al pago seguro de Tebex…", "info");
        window.location.href = checkoutData.checkoutUrl;
      } catch (error) {
        showMessage(error.message, "error");
        buyButton.disabled = false;
        buyButton.textContent = "Comprar 10 Coins";
      }
    }

    buyButton.addEventListener("click", buy);
    loadCatalog();
    loadOrders();
  </script>
</body>
</html>
